{{- range $name, $service := .Values.services }}
{{- if $service.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: online-boutique
spec:
{{- if not (and $service.autoscaling $service.autoscaling.enabled) }}
  replicas: {{ default 1 $service.replicaCount }}
{{- end }}
{{- with $service.rollingUpdate }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .maxUnavailable | quote }}
      maxSurge: {{ .maxSurge | quote }}
{{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: online-boutique
{{- if $service.istioInject }}
        sidecar.istio.io/inject: "true"
{{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: {{ $name }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            {{ with $service.runtimeUser }}
            runAsUser: {{ .uid }}
            runAsGroup: {{ .gid }}
            {{ end }}
            capabilities:
              drop:
                - ALL

          image: "{{ $.Values.global.imageRegistry }}/{{ $service.image.repository }}:{{ $service.image.tag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}

          ports:
            - name: tcp
              containerPort: {{ $service.containerPort }}
              protocol: TCP

          startupProbe:
            tcpSocket:
              port: tcp
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30

          readinessProbe:
            tcpSocket:
              port: tcp
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: tcp
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          {{- with $service.resources }}
          resources:
{{ toYaml . | indent 12 }}
          {{- end }}

          {{- if or $service.env $service.secretEnv }}
          env:
            {{- range $key, $value := $service.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $key, $value := $service.secretEnv }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $value.secretName | quote }}
                  key: {{ $value.key | quote }}
            {{- end }}
          {{- end }}
---
{{- end }}
{{- end }}
