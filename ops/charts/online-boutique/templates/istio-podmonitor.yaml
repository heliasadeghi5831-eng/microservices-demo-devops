apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: online-boutique-istio-proxies
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace | quote }}
  selector:
    matchLabels:
      sidecar.istio.io/inject: "true"
  podMetricsEndpoints:
    - port: http-envoy-prom
      path: /stats/prometheus
      interval: 15s