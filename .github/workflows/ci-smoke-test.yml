name: CI Smoke Test

on:
  push:
    branches:
      - devops-lab
    paths:
      - ".github/workflows/ci-smoke-test.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on:
      - self-hosted
      - Windows
      - X64
      - docker
      - nexus

    timeout-minutes: 15

    env:
      DOCKER_CONTEXT: desktop-linux

    steps:
      - name: Checkout repository without marketplace action
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Set-Location $env:GITHUB_WORKSPACE

          git init
          git config --global --add safe.directory $env:GITHUB_WORKSPACE

          git remote remove origin 2>$null
          git remote add origin "https://github.com/$($env:GITHUB_REPOSITORY).git"

          $authValue = "x-access-token:$env:GH_TOKEN"
          $authBytes = [System.Text.Encoding]::ASCII.GetBytes($authValue)
          $authToken = [Convert]::ToBase64String($authBytes)

          git `
            -c "http.extraheader=AUTHORIZATION: basic $authToken" `
            fetch `
            --no-tags `
            --prune `
            --depth=1 `
            origin `
            $env:GITHUB_SHA

          if ($LASTEXITCODE -ne 0) {
            throw "Git fetch failed."
          }

          git checkout --detach FETCH_HEAD

          if ($LASTEXITCODE -ne 0) {
            throw "Git checkout failed."
          }
      - name: Show runner information
        shell: powershell
        run: |
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS: $env:RUNNER_OS"
          Write-Host "Architecture: $env:RUNNER_ARCH"
          git rev-parse --short HEAD

      - name: Check Docker and Nexus
        shell: powershell
        run: |
          docker version --format "Client={{.Client.Version}} | Server={{.Server.Version}}"

          if ($LASTEXITCODE -ne 0) {
            throw "Docker engine is unavailable."
          }

          $nexus = docker ps `
            --filter "name=^/nexus$" `
            --format "{{.Names}} | {{.Status}}"

          if ($LASTEXITCODE -ne 0 -or -not $nexus) {
            throw "Nexus container is not running."
          }

          Write-Host "Nexus: $nexus"

      - name: Login to Nexus
        shell: powershell
        env:
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD_V2 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NEXUS_PASSWORD)) {
            throw "NEXUS_PASSWORD secret is empty."
          }

          # Remove accidental spaces or new lines around the secret.
          $nexusPassword = $env:NEXUS_PASSWORD.Trim()

          $previousErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = "Continue"

          try {
            $nexusPassword |
              docker login localhost:8081 `
                --username nexus-ci `
                --password-stdin

            $loginExitCode = $LASTEXITCODE
          }
          finally {
            $ErrorActionPreference = $previousErrorActionPreference

            Remove-Variable nexusPassword `
              -ErrorAction SilentlyContinue
          }

          if ($loginExitCode -ne 0) {
            throw "Nexus login failed with exit code $loginExitCode."
          }

          Write-Host "Nexus login succeeded."
      - name: Pull image through Nexus proxy
        shell: powershell
        run: |
          docker pull localhost:8081/docker-proxy/library/alpine:3.23

          if ($LASTEXITCODE -ne 0) {
            throw "Nexus proxy pull failed."
          }

